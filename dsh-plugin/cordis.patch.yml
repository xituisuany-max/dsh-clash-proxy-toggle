# proxy-toggle bundle patch: inserts its public dsh.client entry into the web plugin roster.
# Install with `dsh plugin --profile <name> add <path-or-git-url>` or by adding the
# package to the profile's package.json dsh.profile.bundles.
- insert:
    - id: ui-proxy-toggle
      name: '@dsh-external/dsh-client-ui-proxy-toggle'
